function sheet(st){side.classList.remove('half','full');if(st)side.classList.add(st);
  document.getElementById('arr').textContent=st==='full'?'▼':'▲';}
document.getElementById('handle').onclick=e=>{if(e.target.closest('button'))return;
  sheet(side.classList.contains('full')?'':side.classList.contains('half')?'full':'half');};
document.getElementById('hd').onclick=()=>{if(isMobile())document.getElementById('hd').classList.toggle('open');};
function itemEl(p){const d=document.createElement('div');d.className='item'+(hasFlag(p)?' fl':'')+(cur===p._i?' on':'');d.id='it'+p._i;
  d.innerHTML='<span class="km">'+(p.km!=null?p.km+'km':'')+'</span><span class="sw">'+svgOf(p,true).svg+'</span> <b>'+(hasFlag(p)?'🚩'+esc(p.flag)+' ':'')+esc(p.name)+'</b><div class="meta">'+F.slice(0,2).map(([k])=>esc(p[k]||'')).filter(Boolean).join('｜')+'</div>';
  d.onclick=()=>select(p._i,true);return d;}
function renderList(){list.innerHTML='';const s=q.value.trim();let n=0;
  const ok=p=>{if(!visible(p))return false;const txt=[p.name,p.note,...F.map(([k])=>p[k])].join(' ');return !s||txt.includes(s);};
  const a=FL.filter(ok),b=sorted.filter(ok);
  if(a.length){const g=document.createElement('div');g.className='grp';g.textContent='🚩 '+FLAGLABEL+'（'+a.length+'）';list.appendChild(g);a.forEach(p=>list.appendChild(itemEl(p)));}
  if(b.length){if(a.length){const g=document.createElement('div');g.className='grp';g.textContent='ほかの地点（'+b.length+'）';list.appendChild(g);}b.forEach(p=>list.appendChild(itemEl(p)));}
  document.getElementById('cnt').textContent='一覧 '+(a.length+b.length)+'件';}
function select(i,fromList){cur=i;document.querySelectorAll('.item.on').forEach(e=>e.classList.remove('on'));
  const it=document.getElementById('it'+i);if(it){it.classList.add('on');if(!fromList&&!isMobile())it.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(fromList&&isMobile())sheet('');
  api&&api.open(i,fromList);}
const cw=document.getElementById('cats');
ORDER.forEach(c=>{const n=PTS.filter(p=>p.cat===c).length;if(!n)return;const l=document.createElement('label');
  l.innerHTML='<input type="checkbox" checked><span class="sw">'+catSw(c)+'</span>'+esc(CATS[c].label)+'（'+n+'）';
  l.querySelector('input').onchange=e=>{show[c]=e.target.checked;renderList();api&&api.filter();};cw.appendChild(l);});
function setAll(v){ORDER.forEach(c=>show[c]=v);cw.querySelectorAll('input').forEach(i=>i.checked=v);renderList();api&&api.filter();}
document.getElementById('catOff').onclick=()=>setAll(false);document.getElementById('catOn').onclick=()=>setAll(true);
// 「🚩コースだけ」ボタン（コースの地点があるときだけ）
const cbs=[];
if(FL.length)['courseD','courseM'].forEach(id=>{const b=document.createElement('button');b.type='button';b.className='course';
  b.textContent='🚩 '+FLAGLABEL+'だけ（'+FL.length+'）';b.onclick=e=>{e.stopPropagation();courseOnly=!courseOnly;
    cbs.forEach(x=>{x.classList.toggle('on',courseOnly);x.textContent=(courseOnly?'すべて表示に戻す':'🚩 '+FLAGLABEL+'だけ（'+FL.length+'）');});
    renderList();if(api){api.filter();api.fit(courseOnly?FL.filter(p=>show[p.cat]):null);}};
  document.getElementById(id).appendChild(b);cbs.push(b);});
q.oninput=renderList;renderList();
const LINE=FL.filter(p=>p.line!==false);
// ---- Google Maps ----
function initGoogle(){const g=google.maps;
  const map=new g.Map(document.getElementById('map'),{center:{lat:HOME.lat,lng:HOME.lon},zoom:11,mapTypeControl:true,
    mapTypeControlOptions:{mapTypeIds:['roadmap','satellite','hybrid','terrain']},streetViewControl:true,fullscreenControl:!isMobile(),gestureHandling:'greedy'});
  const iw=new g.InfoWindow(), sv=map.getStreetView(), svs=new g.StreetViewService();
  new g.Marker({map,position:{lat:HOME.lat,lng:HOME.lon},title:HOME.name,zIndex:999,
    icon:{path:'M0,-10 L2.9,-3.1 L10,-3.1 L4.3,1.3 L6.5,8.4 L0,4.2 L-6.5,8.4 L-4.3,1.3 L-10,-3.1 L-2.9,-3.1 Z',fillColor:'#111',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.5,scale:1.3}});
  (CFG.rings_km||[]).forEach(km=>new g.Circle({map,center:{lat:HOME.lat,lng:HOME.lon},radius:km*1000,strokeColor:'#666',strokeOpacity:.5,strokeWeight:1,fillOpacity:0,clickable:false}));
  if(LINE.length>1)new g.Polyline({map,path:LINE.map(p=>({lat:p.lat,lng:p.lon})),strokeOpacity:0,clickable:false,
    icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:.85,strokeColor:'#C2410C',scale:3},offset:'0',repeat:'12px'}]});
  const mk=PTS.map(p=>{const s=svgOf(p);const m=new g.Marker({map,position:{lat:p.lat,lng:p.lon},title:p.name,zIndex:hasFlag(p)?600:(sty(p).size>22?300:100),
      icon:{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(s.svg),scaledSize:new g.Size(s.w,s.h),anchor:new g.Point(s.anchor[0],s.anchor[1])}});
    m.addListener('click',()=>select(p._i,false));return m;});
  function fit(arr){const b=new g.LatLngBounds();if(!arr)b.extend({lat:HOME.lat,lng:HOME.lon});(arr||PTS).forEach(p=>b.extend({lat:p.lat,lng:p.lon}));
    map.fitBounds(b,isMobile()?{top:30,left:20,right:20,bottom:30}:40);}
  fit(null);
  g.event.addListener(iw,'domready',()=>{const bt=document.querySelector('button.sv');if(!bt)return;bt.onclick=()=>{const p=PTS[+bt.dataset.sv];
    svs.getPanorama({location:{lat:p.lat,lng:p.lon},radius:200},(d,st)=>{if(st==='OK'){sv.setPosition(d.location.latLng);sv.setPov({heading:0,pitch:0});sv.setVisible(true);}else alert_('この地点の近く200m以内にストリートビューがありません');});};});
  api={open(i,pan){const p=PTS[i];iw.setContent(card(p,true));iw.open({map,anchor:mk[i]});if(pan){map.panTo(mk[i].getPosition());if(map.getZoom()<14)map.setZoom(15);}},
       filter(){mk.forEach((m,i)=>m.setVisible(visible(PTS[i])));},fit};
  document.getElementById('engine').textContent='地図：Google Maps（左上で地図/航空写真を切替、人型アイコンや「ストリートビュー」でストリートビュー）';}
function alert_(m){document.getElementById('engine').textContent=m;}
// ---- Leaflet + 国土地理院タイル（フォールバック） ----
function initLeaflet(reason){document.getElementById('map').innerHTML='';
  const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
  const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>{
    const L=window.L, map=L.map('map');
    let layers, tileName;
    if(CFG.tiles==='osm'){ /* 日本の外（国土地理院タイルが無い）：OpenStreetMap＋Esri航空写真 */
      const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'}).addTo(map);
      const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
      layers={'地図（OpenStreetMap）':osm,'航空写真（Esri）':esri}; tileName='OpenStreetMap';
    }else{
      const std=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'}).addTo(map);
      const pale=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:'国土地理院'});
      const photo=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',{maxZoom:18,attribution:'国土地理院'});
      layers={'標準地図':std,'淡色地図':pale,'航空写真':photo}; tileName='国土地理院タイル';
    }
    L.control.layers(layers).addTo(map);
    L.marker([HOME.lat,HOME.lon],{title:HOME.name,icon:L.divIcon({html:'★',className:'',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
    (CFG.rings_km||[]).forEach(km=>L.circle([HOME.lat,HOME.lon],{radius:km*1000,color:'#666',weight:1,fill:false,dashArray:'4 4',interactive:false}).addTo(map));
    if(LINE.length>1)L.polyline(LINE.map(p=>[p.lat,p.lon]),{color:'#C2410C',weight:3,opacity:.85,dashArray:'6 7',interactive:false}).addTo(map);
    const mk=PTS.map(p=>{const s=svgOf(p);return L.marker([p.lat,p.lon],{title:p.name,zIndexOffset:hasFlag(p)?1000:(sty(p).size>22?300:0),
        icon:L.divIcon({html:s.svg,className:'',iconSize:[s.w,s.h],iconAnchor:s.anchor,popupAnchor:[0,hasFlag(p)?-s.h+4:-s.h/2]})})
      .bindPopup(card(p,false),{maxWidth:320,autoPanPaddingBottomRight:[10,70]}).on('click',()=>select(p._i,false)).addTo(map);});
    function fit(arr){const pts=(arr||PTS).map(p=>[p.lat,p.lon]);if(!arr)pts.push([HOME.lat,HOME.lon]);map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});}
    fit(null);
    api={open(i,pan){mk[i].openPopup();if(pan)map.setView(mk[i].getLatLng(),Math.max(map.getZoom(),15));},
         filter(){mk.forEach((m,i)=>visible(PTS[i])?m.addTo(map):m.remove());},fit};
    document.getElementById('engine').textContent='地図：'+tileName+'＋Leaflet'+(reason?'（'+reason+'）':'')+'。右上で標準/航空写真を切替。ストリートビューはポップアップのリンクからGoogleマップで開く。';};
  document.head.appendChild(s);}
window.gm_authFailure=()=>initLeaflet('Google Maps のAPIキー認証に失敗したため切替');
if(KEY){window.initGoogle=initGoogle;const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(KEY)+'&callback=initGoogle&loading=async&v=weekly&language=ja&region=JP';
  s.async=true;s.onerror=()=>initLeaflet('Google Maps を読み込めなかったため切替');document.head.appendChild(s);}
else initLeaflet('APIキー未設定');
</script></body></html>
